<style>
/* Tile style explorer - not part of the live site */
body{background:#fff}
.bar{position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.bar b{font-size:15px;margin-right:6px}
.bar button{font:600 15px "Open Sans",sans-serif;border:2px solid var(--nav);background:none;color:var(--nav);border-radius:20px;padding:6px 14px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow);color:var(--blue)}
.bar label{font-size:14px;display:flex;gap:6px;align-items:center;margin-left:8px;cursor:pointer}
.note{max-width:900px;margin:14px auto 0;padding:0 16px;text-align:center;color:var(--ink);font-size:16px}
.sec-title{padding:26px 16px 14px}
.area{margin:0 80px 20px}
@media(max-width:800px){.area{margin:0 12px 20px}}
.t{position:relative;display:block;overflow:hidden;background:#eee;color:#fff;text-decoration:none}
.t img,.t video,.t iframe{display:block}
.t .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.t:hover .im,.t:hover video{transform:scale(1.05)}
.t video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.t iframe{position:absolute;left:50%;top:50%;border:0;pointer-events:none;transform:translate(-50%,-50%)}
.ov{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:rgba(44,57,151,.7);font-size:22px;font-weight:700;opacity:0;transition:opacity .2s}
.t:hover .ov{opacity:1}
.round .t{border-radius:12px}
/* 1 collage */
.collage{position:relative}
.collage .t{position:absolute}
/* 2 even grid */
.even{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.even .t{aspect-ratio:16/9}
/* 3 squares */
.squares{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px}
.squares .t{aspect-ratio:1}
/* 4 masonry */
.masonry{columns:4 260px;column-gap:12px}
.masonry .t{break-inside:avoid;margin-bottom:12px;aspect-ratio:var(--r)}
/* 5 justified rows */
.justified{display:flex;flex-direction:column;gap:8px}
.justified .row{display:flex;gap:8px}
.mosaic{display:flex;flex-direction:column;gap:8px}
.mosaic .row,.justified .row{display:flex;gap:8px;margin:0}
.mosaic .stack{display:flex;flex-direction:column;gap:8px;flex:none}
.bar input[type=range]{width:110px;accent-color:var(--yellow)}
/* 6 bento */
.bento{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:200px;grid-auto-flow:dense;gap:10px}
.bento .w{grid-column:span 2}.bento .tall{grid-row:span 2}.bento .big{grid-column:span 2;grid-row:span 2}
@media(max-width:640px){.bento .w,.bento .big{grid-column:span 1}}
/* 7 cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{display:block;background:#fff;color:var(--blue);text-decoration:none;box-shadow:0 2px 10px rgba(44,57,151,.15);transition:transform .2s,box-shadow .2s;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(44,57,151,.25)}
.card .t{aspect-ratio:16/9}
.card .ov{display:none}
.card h3{margin:0;padding:12px 14px 2px;font-size:18px}
.card p{margin:0;padding:0 14px 14px;font-size:14px;color:#777}
.round .card{border-radius:12px}.round .card .t{border-radius:0}
/* 8 showcase */
.showcase{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:16px}
@media(max-width:640px){.showcase{grid-template-columns:1fr}}
.showcase .t{aspect-ratio:16/9}
.showcase .ov{opacity:1;inset:auto 0 0 0;justify-content:flex-start;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:40px 18px 14px;font-size:22px}
</style>
</head>

   for(let i=0;i<list.length;i++){
     const x=list[i], y=list[i+1];
     if(y && x.r>1.25 && y.r>1.25 && (flip=!flip)){ groups.push([x,y]); i++; }
     else groups.push([x]);
   }
   // a group of k items, stacked, at row height H has width (H - gap*(k-1)) * a, where a = 1/sum(1/r)
   const A=g=>1/g.reduce((s,x)=>s+1/x.r,0);
   const solveH=row=>{let a=0,b=0;row.forEach(g=>{const ag=A(g);a+=ag;b+=gap*(g.length-1)*ag});return (W-gap*(row.length-1)+b)/a};
   // 2. fill rows greedily until the justified height drops to the target
   const rows=[]; let row=[], n=0;
   groups.forEach(g=>{
     row.push(g);
     const target=featured&&rows.length%3===2?base*1.35:base;
     if(solveH(row)<=target){rows.push([row,false]);row=[];}
   });
   if(row.length) rows.push([row,true]);
   el.innerHTML=rows.map(([r,last],ri)=>{
     const target=featured&&ri%3===2?base*1.35:base;
     let H=solveH(r); if(last&&H>target) H=target;   // don't blow up a short last row
     return `<div class="row">${r.map(g=>{
       const w=(H-gap*(g.length-1))*A(g);
       if(g.length===1) return tileHTML(g[0],'',`width:${w}px;height:${H}px;flex:none`);
       return `<div class="stack" style="width:${w}px">${g.map(x=>tileHTML(x,'',`width:${w}px;height:${w/x.r}px`)).join('')}</div>`;
     }).join('')}</div>`;
   }).join('');
 },
 bento(el,list){
   el.className='area bento';
   el.innerHTML=list.map((x,i)=>tileHTML(x, i%7===0?'big':x.r>1.6?'w':x.r<0.75?'tall':'')).join('');
 },
 cards(el,list,key){
   el.className='area cards';
   el.innerHTML=list.filter(x=>x.l).map(x=>`<a class="card" href="../${x.l}/">${tileHTML({...x,l:null})}<h3>${esc(x.t||x.l.replace(/-/g,' '))}</h3><p>${SECT[key]}</p></a>`).join('');
 },
};
let style='mosaic', rowH=300;
const render=()=>{
  document.querySelectorAll('.bar button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===style));
  document.getElementById('desc').textContent=DESC[style];
  for(const key of ['g','a']){
    const el=document.getElementById(key), list=T[key]; el.style.aspectRatio='';
    if(style==='collage') R.collage(el,list,key);
    else if(style==='justified') R.justified(el,list);
    else if(style==='mosaic') R.mosaic(el,list,false);
    else if(style==='mosaic2') R.mosaic(el,list,true);
    else if(style==='bento') R.bento(el,list);
    else if(style==='cards') R.cards(el,list,key);
    else R.simple(el,list,style);
  }
  document.getElementById('rhl').style.display=/justified|mosaic/.test(style)?'flex':'none';
  bindHover();
  try{localStorage.setItem('tileStyle',style)}catch(e){}
};
// hover previews (same as the homepage)
const canHover=matchMedia('(hover:hover)').matches;
const embedUrl=e=>{const [s,id]=e.split(':');return s==='yt'?`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1&loop=1&playlist=${id}&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`:`https://player.vimeo.com/video/${id}?background=1&autoplay=1&muted=1&loop=1&dnt=1`};
function bindHover(){
  if(!canHover) return;
  document.querySelectorAll('.t[data-video],.t[data-embed]').forEach(t=>{
    let el=null,timer=0; const ov=t.querySelector('.ov');
    t.addEventListener('mouseenter',()=>{
      if(t.dataset.video){ if(!el){el=document.createElement('video');Object.assign(el,{muted:true,loop:true,playsInline:true,src:t.dataset.video});t.insertBefore(el,ov)} el.play().catch(()=>{}); }
      else timer=setTimeout(()=>{const w=t.clientWidth,h=t.clientHeight,fw=Math.max(w,h*16/9);el=document.createElement('iframe');el.allow='autoplay; encrypted-media';el.referrerPolicy='strict-origin-when-cross-origin';el.style.width=Math.ceil(fw)+'px';el.style.height=Math.ceil(fw*9/16)+'px';el.src=embedUrl(t.dataset.embed);t.insertBefore(el,ov)},150);
    });
    t.addEventListener('mouseleave',()=>{clearTimeout(timer);if(!el)return;if(el.tagName==='VIDEO')el.pause();else{el.remove();el=null}});
  });
}
document.querySelectorAll('.bar button').forEach(b=>b.addEventListener('click',()=>{style=b.dataset.s;render()}));
const rh=document.getElementById('rh');
rh.addEventListener('input',()=>{rowH=+rh.value;document.getElementById('rhv').textContent=rowH;render()});
const rd=document.getElementById('round');
rd.addEventListener('change',()=>document.querySelector('main').classList.toggle('round',rd.checked));
try{const s=localStorage.getItem('tileStyle'); if(s&&DESC[s]) style=s}catch(e){}
render();
let rz=0; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
}
</script>
